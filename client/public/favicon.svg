<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGradient)" filter="url(#shadow)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="url(#glowGradient)" stroke-width="6" />

  <!-- Medical Cross Accent Background (Translucent) -->
  <path d="M220 120 h72 v80 h80 v72 h-80 v80 h-72 v-80 h-80 v-72 h80 z" fill="#ffffff" fill-opacity="0.14" />

  <!-- Dynamic ECG / Pulse Heartbeat Wave Line -->
  <path d="M88 268 H184 L212 184 L248 344 L288 220 L314 288 L334 268 H424" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- AI Glowing Pulse Node -->
  <circle cx="248" cy="344" r="14" fill="#38bdf8" />
  <circle cx="212" cy="184" r="14" fill="#67e8f9" />
</svg>

